<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KDP Cover AI – YouTube Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 2560px;
    height: 1440px;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .banner {
    width: 2560px;
    height: 1440px;
    position: relative;
    background: linear-gradient(135deg, #0f0c29 0%, #1a1040 40%, #0d1b2a 100%);
    overflow: hidden;
  }

  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(139,92,246,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.08) 1px, transparent 1px);
    background-size: 120px 120px;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(160px);
    opacity: 0.35;
  }
  .orb1 { width: 1000px; height: 1000px; background: #7c3aed; top: -300px; left: -200px; }
  .orb2 { width: 800px;  height: 800px;  background: #2563eb; bottom: -200px; right: 400px; }
  .orb3 { width: 600px;  height: 600px;  background: #6d28d9; top: 400px; right: -100px; }

  /* Book covers — left side */
  .covers-group {
    position: absolute;
    left: 180px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
  }
  .mini-cover {
    width: 144px;
    height: 216px;
    border-radius: 8px;
    border: 3px solid rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  }
  .mini-cover:nth-child(1) { background: linear-gradient(160deg,#1e1b4b,#312e81); transform: rotate(-8deg) translateX(20px); z-index:1; }
  .mini-cover:nth-child(2) { background: linear-gradient(160deg,#831843,#9f1239); transform: rotate(-3deg) translateX(10px); z-index:2; }
  .mini-cover:nth-child(3) { background: linear-gradient(160deg,#064e3b,#065f46); transform: rotate(2deg);                  z-index:3; }
  .mini-cover:nth-child(4) { background: linear-gradient(160deg,#1c1917,#292524); transform: rotate(7deg) translateX(-10px); z-index:4; }
  .cover-line  { position:absolute; bottom:48px; left:16px; right:16px; height:5px; background:rgba(255,255,255,0.3); border-radius:3px; }
  .cover-line2 { position:absolute; bottom:32px; left:24px; right:24px; height:4px; background:rgba(255,255,255,0.15); border-radius:3px; }

  /* Centre content */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    text-align: center;
  }

  .badge {
    background: rgba(139,92,246,0.2);
    border: 2px solid rgba(139,92,246,0.5);
    color: #a78bfa;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 100px;
  }

  .logo {
    font-size: 104px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
    letter-spacing: -2px;
  }
  .logo span { color: #8b5cf6; }

  .tagline {
    font-size: 36px;
    color: #94a3b8;
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  .pills {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }
  .pill {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.12);
    color: #cbd5e1;
    font-size: 22px;
    font-weight: 600;
    padding: 8px 24px;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pill-check { color: #4ade80; font-size: 20px; }

  /* Right side */
  .schedule {
    position: absolute;
    right: 180px;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
  }
  .schedule-label {
    color: #64748b;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .schedule-day {
    color: #e2e8f0;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .schedule-day span { color: #8b5cf6; }
  .url {
    margin-top: 24px;
    color: #8b5cf6;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* Bottom badge */
  .kdp-badge {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(16,185,129,0.15);
    border: 2px solid rgba(16,185,129,0.4);
    color: #34d399;
    font-size: 22px;
    font-weight: 700;
    padding: 10px 40px;
    border-radius: 100px;
    letter-spacing: 2px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="covers-group">
    <div class="mini-cover"><div class="cover-line"></div><div class="cover-line2"></div></div>
    <div class="mini-cover"><div class="cover-line"></div><div class="cover-line2"></div></div>
    <div class="mini-cover"><div class="cover-line"></div><div class="cover-line2"></div></div>
    <div class="mini-cover"><div class="cover-line"></div><div class="cover-line2"></div></div>
  </div>

  <div class="content">
    <div class="badge">✦ AI-Powered Book Covers</div>
    <div class="logo">KDP Cover <span>AI</span></div>
    <div class="tagline">Generate professional book covers in 30 seconds</div>
    <div class="pills">
      <div class="pill"><span class="pill-check">✓</span> All KDP Trim Sizes</div>
      <div class="pill"><span class="pill-check">✓</span> 300 DPI PDF Export</div>
      <div class="pill"><span class="pill-check">✓</span> No Design Skills</div>
      <div class="pill"><span class="pill-check">✓</span> Instant Activation</div>
    </div>
  </div>

  <div class="schedule">
    <div class="schedule-label">New videos</div>
    <div class="schedule-day"><span>Every Week</span></div>
    <div class="schedule-day">KDP Tips & Tutorials</div>
    <div class="url">kdpcoverai.site</div>
  </div>

  <div class="kdp-badge">✦ Trusted by Self-Published Authors on Amazon KDP ✦</div>
</div>
</body>
</html>
