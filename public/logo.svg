<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="6" x2="60" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="74" y1="48" x2="134" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Icon: gradient rounded square -->
  <rect x="0" y="6" width="60" height="60" rx="14" fill="url(#brand)"/>

  <!-- Open book inside square -->
  <!-- Left page -->
  <rect x="10" y="18" width="17" height="30" rx="2" fill="white" opacity="0.92"/>
  <!-- Right page -->
  <rect x="31" y="18" width="17" height="30" rx="2" fill="white" opacity="0.75"/>
  <!-- Center spine -->
  <rect x="27" y="18" width="6" height="30" fill="white" opacity="0.88"/>

  <!-- Lines on left page -->
  <rect x="13" y="24" width="11" height="2" rx="1" fill="#7C3AED" opacity="0.6"/>
  <rect x="13" y="29" width="9" height="2" rx="1" fill="#7C3AED" opacity="0.4"/>
  <rect x="13" y="34" width="10" height="2" rx="1" fill="#7C3AED" opacity="0.4"/>

  <!-- AI sparkle star (top-right of icon) -->
  <path d="M47 13 L48.4 17.6 L53 19 L48.4 20.4 L47 25 L45.6 20.4 L41 19 L45.6 17.6 Z" fill="white" opacity="0.95"/>
  <path d="M53 11 L53.8 13.2 L56 14 L53.8 14.8 L53 17 L52.2 14.8 L50 14 L52.2 13.2 Z" fill="white" opacity="0.65"/>

  <!-- Brand name -->
  <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.5" fill="white">KDP Cover</text>
  <text x="74" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="6" fill="url(#textGrad)">AI</text>
</svg>
